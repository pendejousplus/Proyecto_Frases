<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - Proyecto Frases</title>
    <style>
        .alerta-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        .alerta-exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        .guia-requisitos { background-color: #e2e3e5; color: #383d41; padding: 8px; border-radius: 4px; font-size: 0.9em; margin-bottom: 15px; }
        input { padding: 6px; width: 260px; margin-top: 4px; }
        button { padding: 7px 15px; cursor: pointer; }
    </style>
</head>
<body>
    {% if error %}
        <div class="alerta-error"><strong>Error:</strong> {{ error }}</div>
    {% endif %}

    {% if exito %}
        <div class="alerta-exito"><strong>Correcto:</strong> {{ exito }}</div>
    {% endif %}

    <h2>Iniciar Sesión</h2>
    <form method="POST" action="/">
        <input type="hidden" name="accion" value="login">
        <label>Usuario:</label><br>
        <input type="text" name="usuario" value="{{ login_usuario }}" required><br><br>
        <label>Contraseña:</label><br>
        <input type="password" name="password" required><br><br>
        <button type="submit">Entrar</button>
    </form>

    <hr style="margin: 25px 0;">

    <h2>Registrarse</h2>
    <div class="guia-requisitos">
        <strong>Requisitos de validación:</strong><br>
        • <strong>Usuario:</strong> entre 5 y 20 caracteres (solo letras y números).<br>
        • <strong>Contraseña:</strong> mínimo 8 caracteres y debe coincidir con la confirmación.
    </div>

    <form method="POST" action="/">
        <input type="hidden" name="accion" value="registro">
        <label>Nuevo Usuario:</label><br>
        <input type="text" name="usuario" value="{{ reg_usuario }}" required><br><br>
        <label>Contraseña:</label><br>
        <input type="password" name="password" required><br><br>
        <label>Confirmar Contraseña:</label><br>
        <input type="password" name="confirmar_password" required><br><br>
        <button type="submit">Crear cuenta</button>
    </form>
</body>
</html>
